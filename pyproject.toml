[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "i3bridge"
version = "0.1.0"
description = "Discord <-> InterMUD-3 bridge that appears on the I3 network as the mud 'Discord'"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "discord.py>=2.4",
  "aiohttp>=3.9",
  "Unidecode>=1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "hypothesis>=6",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
i3bridge = "i3bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC109"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["i3bridge"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["unidecode", "unidecode.*"]
ignore_missing_imports = true
