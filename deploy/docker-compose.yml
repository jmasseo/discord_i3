# From the repo root:
#   docker compose -f deploy/docker-compose.yml up -d --build
#   podman-compose -f deploy/docker-compose.yml up -d --build   (rootless: see README)
# DISCORD_TOKEN is read from the repo-root .env file (DISCORD_TOKEN=...).
services:
  i3bridge:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    image: i3bridge
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../config.toml:/app/config.toml:ro,z
      - ../state:/app/state:z         # holds the router password; back this directory up
    ports:
      - "127.0.0.1:8080:8080"         # /health, /health/ready, /metrics
